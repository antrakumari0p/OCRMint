    <!-- ==========================================================
         Prevent Theme Flash
    =========================================================== -->

    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ocrmint-theme");

          var isDark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;

          if (isDark) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
